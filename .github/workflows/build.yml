name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PRIVATE_KEY: ${{ secrets.HYPERVIP_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Use private signing key
        if: env.HAS_PRIVATE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HYPERVIP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HYPERVIP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYPERVIP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HYPERVIP_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "HYPERVIP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "HYPERVIP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "HYPERVIP_KEY_ALIAS=$KEY_ALIAS"
            echo "HYPERVIP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build release APK
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk hyper-vip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hyper-vip-${{ github.run_number }}
          path: hyper-vip.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Hyper VIP 0.1.${{ github.run_number }}
          make_latest: 'true'
          files: hyper-vip.apk
          body: |
            Open this page on your phone and tap **hyper-vip.apk** to install.

            Built from ${{ github.sha }} on `${{ github.ref_name }}`.
